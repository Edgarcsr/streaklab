<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link href="/favicon.svg" rel="icon" type="image/svg+xml">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>streaklab: grainy light-streak backgrounds</title>
    <meta
      content="Generate grainy light-streak background images with a color picker and sliders."
      name="description"
    >
    <script>
    "use strict";
    // Apply the stored theme before first paint to avoid a flash.
    try {
      const mode = localStorage.getItem("streaklab-theme");
      const dark =
        mode === "dark" ||
        (mode !== "light" &&
          window.matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.classList.toggle("dark", dark);
      document.documentElement.style.colorScheme = dark ? "dark" : "light";
    } catch {
      // Storage may be blocked; the app falls back to system.
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script src="/src/main.tsx" type="module"></script>
  </body>
</html>
